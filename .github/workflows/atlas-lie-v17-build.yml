name: ATLAS Lie v18 source fetch

on:
  pull_request:
    branches: [main]

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pre-rationalisation 2G2 source
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fsSL 'https://raw.githubusercontent.com/oscar-system/GenericCharacterTables.jl/6db8911b669ab8eafbeb063866e5ee6f3b14da97/data/Tables/2G2/2G2.jl' -o source/2G2-pre-rationalisation.jl
          test "$(git hash-object source/2G2-pre-rationalisation.jl)" = '7a2bdb402eb4736c848cf2635ebcd1523cd2a562'
          wc -c source/2G2-pre-rationalisation.jl
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: atlas-lie-v18-2g2-source
          path: source/2G2-pre-rationalisation.jl
          if-no-files-found: error
